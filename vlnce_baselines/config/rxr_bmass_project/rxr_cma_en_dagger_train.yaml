BASE_TASK_CONFIG_PATH: habitat_extensions/config/rxr_vlnce_english_task.yaml
TRAINER_NAME: dagger
ENV_NAME: VLNCEDaggerEnv
SIMULATOR_GPU_IDS: [0]
TORCH_GPU_ID: 0
NUM_ENVIRONMENTS: 5
TENSORBOARD_DIR: data/tensorboard_dirs/rxr_cma_en_DAgger
CHECKPOINT_FOLDER: data/checkpoints/rxr_cma_en_DAgger/run_1
EVAL_CKPT_PATH_DIR: data/checkpoints/rxr_cma_en_DAgger/run_1
RESULTS_DIR: data/checkpoints/rxr_cma_en_DAgger/evals/run_1

EVAL:
  USE_CKPT_CONFIG: False
  SPLIT: val_unseen
  LANGUAGES: [en-US]
  EPISODE_COUNT: -1
  SAMPLE: True

RL:
  POLICY:
    OBS_TRANSFORMS:
      ENABLED_TRANSFORMS: [ResizeShortestEdge, CenterCropperPerSensor]

IL:
  batch_size: 10
  epochs: 4
  inflection_weight_coef: 1.9

  DAGGER:
    iterations: 100
    update_size: 10000
    p: 0.75
    expert_policy_sensor: SHORTEST_PATH_SENSOR
    expert_policy_sensor_uuid: shortest_path_sensor
    lmdb_map_size: 1.2e12
    lmdb_fp16: False
    lmdb_commit_frequency: 500
    preload_lmdb_features: False
    lmdb_features_dir: data/trajectories_dirs/rxr_en_dagger/trajectories.lmdb
    drop_existing_lmdb_features: True
    epochs: 10

MODEL:
  policy_name: CMAPolicy
  INSTRUCTION_ENCODER:
    bidirectional: True
    sensor_uuid: rxr_instruction
    embedding_size: 768