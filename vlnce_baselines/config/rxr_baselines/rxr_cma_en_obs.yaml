BASE_TASK_CONFIG_PATH: habitat_extensions/config/rxr_vlnce_english_task.yaml
TRAINER_NAME: recollect_trainer
SIMULATOR_GPU_IDS: [0]
TORCH_GPU_ID: 0
NUM_ENVIRONMENTS: 1  # Changed to 1 to avoid multiprocessing issues
NUM_PROCESSES: 1

# Modified directories for observation visualization - won't overwrite existing checkpoints
TENSORBOARD_DIR: data/tensorboard_dirs/rxr_cma_en_obs_visualization
CHECKPOINT_FOLDER: data/checkpoints/rxr_cma_en_obs_visualization
EVAL_CKPT_PATH_DIR: data/checkpoints/rxr_cma_en_obs_visualization
RESULTS_DIR: data/checkpoints/rxr_cma_en_obs_visualization/evals
LOG_FILE: train_obs_visualization.log

INFERENCE:
  SPLIT: test_challenge
  LANGUAGES: [en-US]
  SAMPLE: True
  USE_CKPT_CONFIG: False
  CKPT_PATH: data/checkpoints/rxr_cma_en_obs_visualization/ckpt.14.pth
  PREDICTIONS_FILE: rxr_cma_en_obs_test_challenge.jsonl
  FORMAT: rxr

EVAL:
  USE_CKPT_CONFIG: False
  SPLIT: val_unseen
  LANGUAGES: [en-US]
  EPISODE_COUNT: -1
  SAMPLE: True

RL:
  POLICY:
    OBS_TRANSFORMS:
      ENABLED_TRANSFORMS: [ResizeShortestEdge, CenterCropperPerSensor]

IL:
  batch_size: 1  # Reduced for single environment
  epochs: 1  # Just 1 epoch for quick visualization
  inflection_weight_coef: 1.9

  RECOLLECT_TRAINER:
    preload_size: 5  # Reduced from 30
    preload_trajectories_file: False
    trajectories_file: data/trajectories_dirs/rxr_en_guide_trim250/trajectories.json.gz
    max_traj_len: 250
    gt_file: /home/abhi/Documents/VLN-CE-py38/data/datasets/RxR_VLNCE_v0/{split}/{split}_{role}_gt_filtered.json.gz

MODEL:
  policy_name: CMAPolicy
  INSTRUCTION_ENCODER:
    bidirectional: True
    sensor_uuid: rxr_instruction
    embedding_size: 768

