BASE_TASK_CONFIG_PATH: habitat_extensions/config/rxr_vlnce_english_task.yaml
TRAINER_NAME: recollect_trainer
SIMULATOR_GPU_IDS: [0]
TORCH_GPU_ID: 0
# NUM_ENVIRONMENTS: 8  # Reduced to 1 to avoid multiprocessing issues
NUM_ENVIRONMENTS: 1 # Reduced to 1 to avoid multiprocessing issues
NUM_PROCESSES: 1
TENSORBOARD_DIR: data/tensorboard_dirs/rxr_cma_en_dirty_vision
CHECKPOINT_FOLDER: data/checkpoints/rxr_cma_en_dirty_vision/run1
EVAL_CKPT_PATH_DIR: data/checkpoints/rxr_cma_en_dirty_vision
RESULTS_DIR: data/checkpoints/rxr_cma_en_dirty_vision/evals
# LOG_FILE: data/logs/rxr_cma_en_dirty_vision/run1.log
LOG_FILE: data/logs/rxr_cma_en_dirty_vision/patch/eval/run1.log

INFERENCE:
  SPLIT: test_challenge
  LANGUAGES: [en-US]
  SAMPLE: True
  USE_CKPT_CONFIG: False
  CKPT_PATH: data/checkpoints/rxr_cma_en_dirty_vision/ckpt.14.pth
  PREDICTIONS_FILE: rxr_cma_en_dirty_vision_test_challenge.jsonl
  FORMAT: rxr

EVAL:
  USE_CKPT_CONFIG: False
  SPLIT: val_unseen
  LANGUAGES: [en-US]
  EPISODE_COUNT: 50  # Evaluate only 50 episodes instead of all
  SAMPLE: True
  
  # Enable noisy observations during evaluation - EVERY STEP HAS NOISE
  USE_NOISE: True
  NOISE_PROBABILITY: 1.0  # 100% noise - every step has noise during evaluation
  
  # RGB noise: PATCH only
  RGB_NOISE_TYPE: "patch"
  RGB_NOISE_PARAMS:
    patch:
      num_patches: 10
      patch_size_range: [20, 60]
      patch_type: "random"
  
  # Depth noise: PATCH noise (NEW!)
  DEPTH_NOISE_TYPE: "patch"
  DEPTH_NOISE_PARAMS:
    patch:
      num_patches: 10
      patch_size_range: [20, 60]
      patch_type: "random"  # random grayscale values 0-1

RL:
  POLICY:
    OBS_TRANSFORMS:
      ENABLED_TRANSFORMS: [ResizeShortestEdge, CenterCropperPerSensor]

IL:
  batch_size: 3  # Reduced to match single environment
  # batch_size: 1  # Reduced to match single environment
  epochs: 15  # Just 1 epoch for quick visualization
  inflection_weight_coef: 1.9
  aux_loss_weight: 2.0  # Weight for auxiliary losses (vision embedding reconstruction)
  
  # Enable noise injection during training with probability
  USE_NOISE_INJECTION: True
  NOISE_PROBABILITY: 0.50  # 50% chance to apply noise, 50% clean images
  
  # RGB noise: 50/50 mix of patch and gaussian when noise is applied
  RGB_NOISE_TYPE: "mixed"  # Will randomly choose between patch and gaussian
  RGB_NOISE_TYPES: ["patch", "gaussian"]  # Types to randomly choose from
  RGB_NOISE_PARAMS:
    gaussian:
      mean: 0
      std: 0.25  # 25% Gaussian noise
    patch:
      num_patches: 10
      patch_size_range: [20, 60]
      patch_type: "random"  # random colorful patches for RGB
  
  # Depth noise: 50/50 mix of patch and gaussian when noise is applied (same as RGB)
  DEPTH_NOISE_TYPE: "mixed"  # Will randomly choose between patch and gaussian
  DEPTH_NOISE_TYPES: ["patch", "gaussian"]  # Types to randomly choose from (same as RGB)
  DEPTH_NOISE_PARAMS:
    gaussian:
      mean: 0
      std: 0.25  # 25% Gaussian noise
    patch:
      num_patches: 10
      patch_size_range: [20, 60]
      patch_type: "random"  # random grayscale patches for depth
  
  # Optional: Save noisy observations for visualization
  SAVE_NOISY_OBS: True
  NOISY_OBS_DIR: "training_observations"
  NOISY_OBS_SAVE_FREQ: 50

  RECOLLECT_TRAINER:
    preload_size: 30  # Reduced to match batch size
    # preload_size: 3  # Reduced to match batch size
    preload_trajectories_file: False
    trajectories_file: data/trajectories_dirs/rxr_en_guide_trim250/trajectories.json.gz
    max_traj_len: 250
    gt_file: /home/abhi/Documents/VLN-CE-py38/data/datasets/RxR_VLNCE_v0/{split}/{split}_{role}_gt_filtered.json.gz

MODEL:
  policy_name: CMAPolicy
  INSTRUCTION_ENCODER:
    bidirectional: True
    sensor_uuid: rxr_instruction
    embedding_size: 768

