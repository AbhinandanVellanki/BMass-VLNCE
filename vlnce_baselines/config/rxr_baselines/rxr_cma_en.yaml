BASE_TASK_CONFIG_PATH: habitat_extensions/config/rxr_vlnce_english_task.yaml
TRAINER_NAME: recollect_trainer
SIMULATOR_GPU_IDS: [0]
TORCH_GPU_ID: 0
NUM_ENVIRONMENTS: 1
TENSORBOARD_DIR: data/tensorboard_dirs/rxr_cma_en_dirty_vision_text/run1
CHECKPOINT_FOLDER: data/checkpoints/rxr_cma_en_dirty_vision_text/run1
EVAL_CKPT_PATH_DIR: data/checkpoints/rxr_cma_en_dirty_vision_text/run1
RESULTS_DIR: data/checkpoints/rxr_cma_en_dirty_vision_text/run1
LOG_FILE: data/logs/rxr_cma_en_dirty_vision_text/run1.log

TASK_CONFIG:
  TASK:
    RXR_INSTRUCTION_SENSOR:
      features_path: "data/datasets/RxR_VLNCE_v0/text_features/rxr_{split}/{id:06}_{lang}_text_features.npz"
      # Path to noisy instruction features (set to null or comment out to disable)
      noisy_features_path: "data/datasets/RxR_VLNCE_v0/noisy_text_features/rxr_{split}/{id:06}_{lang}_noisy_text_features.npz"

INFERENCE:
  SPLIT: test_challenge
  LANGUAGES: [en-US]
  SAMPLE: True
  USE_CKPT_CONFIG: False
  CKPT_PATH: /home/abhi/Documents/VLN-CE-py38/data/checkpoints/rxr_cma_en_20/run_1/ckpt.14.pth # REPLACE THIS
  PREDICTIONS_FILE: rxr_cma_en_20_test_challenge.jsonl
  FORMAT: rxr

EVAL:
  USE_CKPT_CONFIG: False
  SPLIT: val_seen
  LANGUAGES: [en-US]
  EPISODE_COUNT: -1
  SAMPLE: True

  # Enable noisy observations during evaluation (same as training)
  USE_NOISE: True
  NOISE_PROBABILITY: 0.50 # 50% chance to apply noise during eval
  
  RGB_NOISE_TYPE: "mixed" # Mix of choices
  RGB_NOISE_TYPES: ["patch", "gaussian"] # Types to randomly choose from
  RGB_NOISE_PARAMS:
    patch:
      num_patches: 10
      patch_size_range: [20, 60]
      patch_type: "random"
    gaussian:
      mean: 0
      std: 0.25 # 25% Gaussian noise

  DEPTH_NOISE_TYPE: "mixed" # Mix of choices
  DEPTH_NOISE_TYPES: ["patch", "gaussian"] # Types to randomly choose from
  DEPTH_NOISE_PARAMS:
    patch:
      num_patches: 10
      patch_size_range: [20, 60]
      patch_type: "random"
    gaussian:
      mean: 0
      std: 0.25 # 25% Gaussian noise

RL:
  POLICY:
    OBS_TRANSFORMS:
      ENABLED_TRANSFORMS: [ResizeShortestEdge, CenterCropperPerSensor]

IL:
  batch_size: 3
  epochs: 15
  inflection_weight_coef: 1.9
  aux_loss_weight: 2.0 # Weight for auxiliary losses (vision embedding reconstruction)
  
  # Resume training from checkpoint
  load_from_ckpt: True  # Set to True to resume from checkpoint
  ckpt_to_load: data/checkpoints/rxr_cma_en_dirty_vision_text/run_2/ckpt.1.pth

  USE_NOISE_INJECTION: True
  NOISE_PROBABILITY: 0.50 # 50% chance to apply noise, 50% clean images
  # RGB noise: 50/50 mix of patch and gaussian when noise is applied (45% each overall)
  RGB_NOISE_TYPE: "mixed" # Will randomly choose between patch and gaussian
  RGB_NOISE_TYPES: ["patch", "gaussian"] # Types to randomly choose from
  RGB_NOISE_PARAMS:
    gaussian:
      mean: 0
      std: 0.25 # 25% Gaussian noise
    patch:
      num_patches: 10
      patch_size_range: [20, 60]
      patch_type: "random" # random, black, white, gray

  # Depth noise: always gaussian when noise is applied (90% overall)
  DEPTH_NOISE_TYPE: "gaussian"
  DEPTH_NOISE_PARAMS:
    gaussian:
      mean: 0
      std: 0.25 # 25% Gaussian noise

  # Optional: Save noisy observations for visualization
  SAVE_NOISY_OBS: False
  NOISY_OBS_DIR: "training_observations"
  NOISY_OBS_SAVE_FREQ: 50
  RECOLLECT_TRAINER:
    preload_size: 30
    preload_trajectories_file: False
    trajectories_file: data/trajectories_dirs/rxr_en_guide_trim250/trajectories.json.gz
    max_traj_len: 250 # 1.3% of episodes in the English training split are above 250
    gt_file: data/datasets/RxR_VLNCE_v0/{split}/{split}_{role}_gt_filtered.json.gz

MODEL:
  policy_name: CMAPolicy
  TEXT_DENOISING_ALPHA: 10 # Weight for MSE loss between clean and noisy text features
  INSTRUCTION_ENCODER:
    bidirectional: True
    sensor_uuid: rxr_instruction
    embedding_size: 768
